<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space game</title>

  <!-- Tailwind + Iconify -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@3/dist/iconify-icon.min.js" defer></script>

  <!-- Your CSS with .hud-btn etc. -->
  <link rel="stylesheet" href="./src/hud.css" />

  <style>
    body {
      margin: 0;
      background: #000;
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <div id="minimap-container" class="minimap-frame" aria-label="Planet minimap">
    <span class="minimap-label">
      <iconify-icon icon="game-icons:planet-core" width="14" height="14"></iconify-icon>
      Map
    </span>
  </div>

  <div class="hud-shell">
    <div class="hud-resources" aria-label="Resources">
      <div class="hud-resource hud-resource-money">
        <span class="hud-resource-icon">
          <iconify-icon icon="game-icons:coin" width="18" height="18"></iconify-icon>
        </span>
        <div class="hud-resource-copy">
          <span class="hud-resource-label">Money</span>
          <strong id="resource-money">0</strong>
        </div>
      </div>

      <div class="hud-resource hud-resource-fuel">
        <span class="hud-resource-icon">
          <iconify-icon icon="game-icons:gas-cylinder" width="18" height="18"></iconify-icon>
        </span>
        <div class="hud-resource-copy">
          <span class="hud-resource-label">Fuel</span>
          <strong id="resource-fuel">0</strong>
        </div>
      </div>
    </div>

    <div class="hud-toolbar" aria-label="Planet and build controls">
      <div class="hud-panel-group">
        <button id="btn-hand" class="hud-btn hud-btn-primary" title="Build menu">
          <span class="hud-btn-icon">
            <iconify-icon icon="game-icons:claw-hammer" width="24" height="24"></iconify-icon>
          </span>
          <span class="hud-btn-text">Build</span>
        </button>

        <div id="planet-focus-controls" class="hud-panel-stack">
          <button id="btn-planet" class="hud-btn" data-planet="Earth" title="Focus Earth">
            <span class="hud-btn-icon">
              <iconify-icon icon="game-icons:earth-africa-europe" width="22" height="22"></iconify-icon>
            </span>
            <span class="hud-btn-text">Earth</span>
          </button>

          <button id="btn-planet" class="hud-btn" data-planet="Mars" title="Focus Mars">
            <span class="hud-btn-icon">
              <iconify-icon icon="game-icons:ringed-planet" width="22" height="22"></iconify-icon>
            </span>
            <span class="hud-btn-text">Mars</span>
          </button>

          <button id="btn-reset-target" class="hud-btn" title="Center view">
            <span class="hud-btn-icon">
              <iconify-icon icon="game-icons:return-arrow" width="22" height="22"></iconify-icon>
            </span>
            <span class="hud-btn-text">Center</span>
          </button>
        </div>

        <div id="hand-submenu" class="hud-panel-stack hidden">
          <button class="hud-btn hud-building-btn" title="Fuel Mine • 100" data-kind="fuel_mine" data-color="#c0151d"
            data-shape="cylinder">
            <span class="hud-btn-icon">
              <iconify-icon icon="game-icons:fuel-tank" width="22" height="22"></iconify-icon>
            </span>
            <span class="hud-btn-copy">
              <span class="hud-btn-text">Fuel Mine</span>
              <span class="hud-btn-meta">100</span>
            </span>
          </button>

          <button class="hud-btn hud-building-btn" title="Factory • 100" data-kind="factory" data-color="#eaa937"
            data-shape="box">
            <span class="hud-btn-icon">
              <iconify-icon icon="game-icons:factory" width="22" height="22"></iconify-icon>
            </span>
            <span class="hud-btn-copy">
              <span class="hud-btn-text">Factory</span>
              <span class="hud-btn-meta">100</span>
            </span>
          </button>

          <button class="hud-btn hud-building-btn" title="Space Center • 500" data-kind="space_center"
            data-color="#3399ff" data-shape="cone">
            <span class="hud-btn-icon">
              <iconify-icon icon="game-icons:space-shuttle" width="22" height="22"></iconify-icon>
            </span>
            <span class="hud-btn-copy">
              <span class="hud-btn-text">Space Center</span>
              <span class="hud-btn-meta">500</span>
            </span>
          </button>

          <button id="btn-hand-back" class="hud-btn hud-btn-back" title="Back">
            <span class="hud-btn-icon">
              <iconify-icon icon="tabler:arrow-left" width="22" height="22"></iconify-icon>
            </span>
            <span class="hud-btn-text">Back</span>
          </button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
